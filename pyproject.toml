[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "cvanalysis"
version = "2.3.0"
description = "Layered electrochemical CV/EIS/CP analysis workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6,<6.10",
    "Pillow>=9.1",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "setuptools>=67",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
cvanalysis = "cvanalysis.ui.app:run"

[tool.setuptools.packages.find]
include = ["cvanalysis*"]

[tool.setuptools.package-data]
"cvanalysis" = ["default_themes.json", "resources/icons/*.ico"]
"cvanalysis.ui.glass" = ["PyGlass-LICENSE", "PyGlass-NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests_v2"]
addopts = "-q"
cache_dir = ".test_tmp/pytest_cache"
